name: Sync upstream changes

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: linguo2625469/workbuddy2api-panel
      SYNC_BRANCH: upstream-sync
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main

      - name: Merge upstream without touching main
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No upstream changes to merge.'
            exit 0
          fi
          git checkout -B "$SYNC_BRANCH" origin/main
          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search '"Upstream sync conflict" in:title' --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create \
              --title 'Upstream sync conflict' \
              --body "The scheduled sync from ${UPSTREAM_REPO} conflicted with main. No files were overwritten. Merge upstream/main locally into your fork main and resolve conflicts, then close this issue. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label 'upstream-sync'
          else
            echo "Existing conflict issue #$existing"
          fi
          exit 1

      - name: Test merged tree
        if: steps.merge.outputs.changed == 'true'
        run: go test ./...

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Create or update fork-only PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Sync upstream changes" \
              --body "Automated sync from https://github.com/${UPSTREAM_REPO}. This PR targets this fork only; it never submits changes upstream. Review and merge when tests and personal changes are acceptable."
          else
            echo "Updated existing fork-only PR #$pr"
          fi
